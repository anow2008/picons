- name: Build servicelist and picons
        run: |
          chmod +x 1-build-servicelist.sh 2-build-picons.sh
          
          # بناء القائمة والبيكونات
          ./1-build-servicelist.sh srp --name=mybox
          ./2-build-picons.sh srp --name=mybox

          # تحويل الروابط الرمزية إلى صور حقيقية حتى يمكن فكها على الويندوز
          cd build-output
          for dir in binaries-*/; do
            if [ -d "$dir" ]; then
              cd "$dir"
              # فك الضغط وإعادة الضغط بدون symlinks
              for tarfile in *.tar.xz; do
                if [ -f "$tarfile" ]; then
                  mkdir temp_extract
                  tar -xf "$tarfile" -C temp_extract
                  tar -h -cJf "$tarfile" -C temp_extract .
                  rm -rf temp_extract
                fi
              done
              cd ..
            fi
          done
