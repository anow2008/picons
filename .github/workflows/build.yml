name: Build Light Transparent Picons

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git binutils pngquant imagemagick librsvg2-bin jq xz-utils

      - name: Build servicelist and picons
        run: |
          chmod +x 1-build-servicelist.sh 2-build-picons.sh
          
          # بناء القائمة والبيكونات
          ./1-build-servicelist.sh srp --name=mybox
          ./2-build-picons.sh srp --name=mybox

          # تحويل أي روابط رمزية إلى ملفات صور حقيقية لتتوافق مع الويندوز
          find build-output -type l -exec sh -c 'target="$(readlink "$1")"; rm "$1"; cp "$target" "$1"' _ {} \;

      - name: Release Picons
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Picons 220x132 Light Transparent"
          files: build-output/binaries-*/*.tar.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
